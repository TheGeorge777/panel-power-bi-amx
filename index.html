<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HITSS | Panel de reportes</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/viewer.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ Barra lateral ============ -->
  <aside class="sidebar" id="sidebar" aria-label="Navegación">
    <div class="sidebar-inner">
      <div class="brand">
        <img src="assets/img/logo-hitss.png" alt="HITSS">
        <div><b id="brandName"></b><small id="brandSub"></small></div>
      </div>

      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar un reporte" autocomplete="off" aria-label="Buscar un reporte">
      </label>

      <div class="cat-title">Categorías</div>
      <nav class="cats" id="cats"></nav>

      <div class="side-foot">
        <span id="footNote"></span>
        <b id="footAuthor"></b>
      </div>
    </div>
  </aside>

  <!-- ============ Contenido ============ -->
  <main class="main" id="main">
    <div class="topbar">
      <button class="icon-btn" id="sidebarToggle" aria-label="Ocultar o mostrar el menú" aria-expanded="true" title="Ocultar / mostrar menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <span class="crumb" id="crumb">Todos los reportes</span>
    </div>

    <section class="home">
      <div class="hero">
        <div>
          <h1 id="heroTitle"></h1>
          <p class="lead" id="heroLead"></p>
        </div>
        <div class="counter"><strong id="count">0</strong><span>reportes<br>mostrados</span></div>
      </div>
      <div id="groups"></div>
      <div class="empty" id="empty" hidden><b>Sin resultados</b>No encontramos reportes que coincidan con tu búsqueda.</div>
    </section>
  </main>
</div>

<!-- ============ Ventana flotante de vista previa (movible y redimensionable) ============ -->
<div class="vwin" id="vwin" role="dialog" aria-modal="false" aria-labelledby="vname" hidden>
  <div class="vwin-bar" id="vbar">
    <h2 id="vname"></h2>
    <a class="vbtn" id="vnew" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
    <button class="vbtn" id="vmax" type="button" title="Maximizar / restaurar">Maximizar</button>
    <button class="vbtn" id="vclose" type="button">Cerrar</button>
  </div>
  <div class="vwin-body">
    <div class="loader" id="loader"><div class="spin"></div>Cargando reporte…</div>
    <iframe id="frame" title="Reporte Power BI" allowfullscreen></iframe>
  </div>
  <div class="vwin-resize" id="vresize" aria-hidden="true"></div>
</div>

<!-- 1) configuración y datos -->
<script src="js/config.js"></script>
<script src="js/data/01-acumulados.js"></script>
<script src="js/data/02-en-linea.js"></script>
<script src="js/data/03-calidad.js"></script>
<!-- 2) módulos -->
<script src="js/utils.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/cards.js"></script>
<script src="js/viewer.js"></script>
<!-- 3) arranque -->
<script src="js/main.js"></script>
</body>
</html>
